<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recallspection – Exact Memory for AI</title>
    
    <!-- Google Font: Cinzel -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet" />
    
    <style>
        /* ---- Reset & Base ---- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #16161d; /* eigengrau */
            color: #b0b0c0;
            font-family: 'Cinzel', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* ---- Subtle digital grid overlay ---- */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(57, 255, 20, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(57, 255, 20, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        /* ---- Main container ---- */
        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            text-align: center;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
        }

        /* ---- Logo / Headline ---- */
        .logo {
            font-family: 'Cinzel', serif;
            font-weight: 900;
            font-size: clamp(3rem, 12vw, 6.5rem);
            letter-spacing: 0.08em;
            color: #ffffff;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.4),
                0 0 20px rgba(255, 255, 255, 0.2),
                0 0 40px rgba(255, 255, 255, 0.1);
            margin-bottom: 0.2em;
            line-height: 1.1;
            transition: text-shadow 0.3s ease;
        }
        .logo:hover {
            text-shadow: 
                0 0 15px rgba(255, 255, 255, 0.6),
                0 0 30px rgba(255, 255, 255, 0.3),
                0 0 60px rgba(255, 255, 255, 0.15);
        }

        /* ---- Tagline ---- */
        .tagline {
            font-family: 'Cinzel', serif;
            font-weight: 400;
            font-size: clamp(0.9rem, 2vw, 1.4rem);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: #39ff14;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
            margin-bottom: 2.5rem;
            border-bottom: 1px solid rgba(57, 255, 20, 0.2);
            padding-bottom: 1rem;
            display: inline-block;
        }

        /* ---- Description ---- */
        .description {
            font-family: 'Cinzel', serif;
            font-weight: 400;
            font-size: clamp(0.85rem, 1.4vw, 1.1rem);
            line-height: 1.8;
            color: #a0a0b8;
            max-width: 600px;
            margin-bottom: 2.5rem;
            letter-spacing: 0.05em;
        }
        .description strong {
            color: #39ff14;
            font-weight: 700;
        }

        /* ---- CTA Button ---- */
        .cta {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 0.8rem 2.8rem;
            background: transparent;
            color: #39ff14;
            border: 2px solid #39ff14;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.15);
            position: relative;
            overflow: hidden;
        }
        .cta::before {
            content: '';
            position: absolute;
            inset: 0;
            background: #39ff14;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s ease;
            z-index: -1;
        }
        .cta:hover {
            color: #16161d;
            box-shadow: 0 0 30px rgba(57, 255, 20, 0.3);
        }
        .cta:hover::before {
            transform: scaleX(1);
            transform-origin: left;
        }

        /* ---- Subtle status bar (bottom) ---- */
        .status {
            font-family: 'Cinzel', serif;
            font-weight: 400;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            color: #39ff14;
            opacity: 0.4;
            margin-top: 3rem;
            border-top: 1px solid rgba(57, 255, 20, 0.1);
            padding-top: 1.5rem;
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
        }
        .status span {
            color: #39ff14;
            opacity: 0.6;
        }
        .status .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #39ff14;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        /* ---- Responsive tweaks ---- */
        @media (max-width: 480px) {
            .container { padding: 1rem; }
            .logo { font-size: 3.2rem; }
            .tagline { font-size: 0.7rem; letter-spacing: 0.2em; }
            .description { font-size: 0.8rem; }
            .cta { font-size: 0.9rem; padding: 0.6rem 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Headline -->
        <h1 class="logo">Recallspection</h1>
        
        <!-- Tagline -->
        <div class="tagline">Exact Memory. Zero Hallucinations.</div>
        
        <!-- Description -->
        <p class="description">
            The first dual‑core memory for AI agents.<br />
            <strong>Cryptographic</strong> precision · <strong>Neural</strong> fuzziness ·
            <strong>100%</strong> exact recall.
        </p>
        
        <!-- Call to Action -->
        <a href="https://recallspection.onrender.com/docs" target="_blank" class="cta">
            Get Your API Key
        </a>
        
        <!-- Status Bar -->
        <div class="status">
            <span><span class="dot"></span> LIVE</span>
            <span>v18.0.0</span>
            <span>∞ FACTS</span>
        </div>
    </div>
</body>
</html>
